plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lanbeam.android'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.avsessisozx.lanbeam'
        minSdk 26
        targetSdk 35
        // CI sets these from the git tag (v1.2.3) and the run number.
        versionCode((System.getenv('LANBEAM_VERSION_CODE') ?: '1') as int)
        versionName System.getenv('LANBEAM_VERSION') ?: '0.1.0-dev'
    }

    sourceSets {
        // The protocol core is shared verbatim with the PC app.
        main.java.srcDirs += '../../core/src/main/java'
    }

    // Every build is signed with the shared key kept in the repo, so new versions install over old ones
    // without any secrets or files on a personal computer. Personal use only; not for Play Store.
    signingConfigs {
        shared {
            storeFile rootProject.file('keystore/lanbeam-shared.jks')
            storePassword 'lanbeam'
            keyAlias 'lanbeam'
            keyPassword 'lanbeam'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    lint {
        // Turkish UI strings are written inline on purpose; keep lint focused on real problems.
        disable 'HardcodedText', 'SetTextI18n', 'ButtonStyle', 'OldTargetApi', 'AndroidGradlePluginVersion'
    }
}

dependencies {
    // QR code scanning (camera) and QR bitmap generation.
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
