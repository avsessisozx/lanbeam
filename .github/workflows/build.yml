name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Sürüm yayınlamak için numara yazın (örn. 0.2.0); boş bırakılırsa sadece derler'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  pc:
    name: PC app + core tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Build jar and run loopback test
        shell: cmd
        run: pc\build.bat test
      - uses: actions/upload-artifact@v7
        with:
          name: pc
          path: dist/LanBeam.jar
          if-no-files-found: error

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Version from tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "LANBEAM_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV";
          elif [ -n "$INPUT_VERSION" ]; then echo "LANBEAM_VERSION=${INPUT_VERSION#v}" >> "$GITHUB_ENV"; fi
          echo "LANBEAM_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: Build and lint
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease lintRelease
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: [pc, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          path: src
      - uses: actions/download-artifact@v8
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="${INPUT_VERSION#v}"; fi
          if [ ! -f android/app-release.apk ]; then
            echo "::error::Signed release APK (app-release.apk) not found in the build artifact."
            exit 1
          fi
          cp pc/LanBeam.jar "LanBeam-$v.jar"
          cp android/app-release.apk "LanBeam-$v.apk"
          cp src/THIRD_PARTY_NOTICES.md THIRD_PARTY_NOTICES.md
          gh release create "v$v" "LanBeam-$v.jar" "LanBeam-$v.apk" THIRD_PARTY_NOTICES.md \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "LanBeam $v" --generate-notes
