name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pc:
    name: PC app + core tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Build jar and run loopback test
        shell: cmd
        run: pc\build.bat test
      - uses: actions/upload-artifact@v7
        with:
          name: pc
          path: dist/LanBeam.jar
          if-no-files-found: error

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Version from tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "LANBEAM_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; fi
          echo "LANBEAM_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: Build and lint
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease lintRelease
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [pc, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          if [ ! -f android/app-release.apk ]; then
            echo "::error::Signed release APK (app-release.apk) not found in the build artifact."
            exit 1
          fi
          cp pc/LanBeam.jar "LanBeam-$v.jar"
          cp android/app-release.apk "LanBeam-$v.apk"
          gh release create "$GITHUB_REF_NAME" "LanBeam-$v.jar" "LanBeam-$v.apk" \
            --repo "$GITHUB_REPOSITORY" --title "LanBeam $v" --generate-notes
