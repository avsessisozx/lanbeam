name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pc:
    name: PC app + core tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build jar and run loopback test
        shell: cmd
        run: pc\build.bat test
      - uses: actions/upload-artifact@v4
        with:
          name: pc
          path: dist/LanBeam.jar
          if-no-files-found: error

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Version from tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "LANBEAM_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; fi
          echo "LANBEAM_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: Release keystore from secrets
        env:
          KEYSTORE_B64: ${{ secrets.LANBEAM_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "LANBEAM_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build and lint
        working-directory: android
        env:
          LANBEAM_KEYSTORE_PASSWORD: ${{ secrets.LANBEAM_KEYSTORE_PASSWORD }}
          LANBEAM_KEY_ALIAS: ${{ secrets.LANBEAM_KEY_ALIAS }}
          LANBEAM_KEY_PASSWORD: ${{ secrets.LANBEAM_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease lintRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [pc, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          cp pc/LanBeam.jar "LanBeam-$v.jar"
          cp android/app-release.apk "LanBeam-$v.apk"
          gh release create "$GITHUB_REF_NAME" "LanBeam-$v.jar" "LanBeam-$v.apk" \
            --repo "$GITHUB_REPOSITORY" --title "LanBeam $v" --generate-notes
